<!DOCTYPE html>

<head>

    <title>框架技术 - Feuerwerk's Knowledge Base</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="../css/docs-style.css">
    <style>
        .fw-container {
            max-width: 1200px;
            margin: 0 auto;
            padding: var(--spacing-lg);
        }

        .fw-header {
            text-align: center;
            margin-bottom: var(--spacing-xl);
            padding: var(--spacing-xl);
            background: linear-gradient(135deg, #43e97b 0%, #38f9d7 100%);
            border-radius: var(--radius-xl);
            color: white;
        }

        .fw-title {
            font-size: 2.5rem;
            font-weight: 700;
            margin-bottom: var(--spacing-md);
        }

        .fw-description {
            font-size: 1.1rem;
            opacity: 0.95;
            max-width: 700px;
            margin: 0 auto;
        }

        .fw-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(350px, 1fr));
            gap: var(--spacing-lg);
            margin-bottom: var(--spacing-xl);
        }

        .fw-card {
            background: var(--bg-primary);
            border-radius: var(--radius-lg);
            padding: var(--spacing-lg);
            box-shadow: var(--shadow-sm);
            transition: all 0.3s ease;
            border: 1px solid var(--border-color);
        }

        .fw-card:hover {
            transform: translateY(-4px);
            box-shadow: var(--shadow-lg);
            border-color: #43e97b;
        }

        .fw-icon {
            width: 60px;
            height: 60px;
            border-radius: var(--radius-lg);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.5rem;
            color: white;
            margin-bottom: var(--spacing-md);
        }
    </style>
</head>

                    <span>Feuerwerk's KB</span>
                </a>
            </div>
            <div class="nav-menu">
                <div class="nav-search">
                    <input type="text" placeholder="搜索文档..." class="search-input">

                    <i class="fas fa-bars"></i>

    <!-- 主要内容 -->

            <!-- 头部 -->

                <h1 class="fw-title">框架技术学习指南</h1>
                <p class="fw-description">
                    掌握主流开发框架，理解框架设计思想和最佳实践

            <!-- 框架主题 -->
            <div class="fw-grid">
                <div class="fw-card">
                    <div class="fw-icon" style="background: linear-gradient(135deg, #43e97b, #38f9d7);">

                    </div>
                    <h3>Spring 生态</h3>
                    <p>从Spring Framework到Spring Boot、Spring Cloud，全面掌握Spring技术栈</p>
                </div>

                <div class="fw-card">
                    <div class="fw-icon" style="background: linear-gradient(135deg, #667eea, #764ba2);">
                        <i class="fas fa-database"></i>
                    </div>
                    <h3>MyBatis</h3>
                    <p>优秀的持久层框架，学习SQL映射、动态SQL、缓存机制</p>
                </div>

                <div class="fw-card">

                        <i class="fab fa-vuejs"></i>
                    </div>

                    <p>渐进式JavaScript框架，掌握组件化开发、状态管理、路由管理</p>
                </div>

                <div class="fw-card">

                </div>
